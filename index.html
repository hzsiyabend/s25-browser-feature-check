<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>S25 browser boundary probe</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 1.5rem; max-width: 48rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f4f6; padding: 1rem; }
  button { display: block; width: 100%; margin: .5rem 0; padding: .8rem; text-align: left; font: inherit; }
  button:disabled { opacity: .5; }
</style>
<h1>S25 browser boundary probe</h1>
<p>Run one case at a time. The page records accepted operations, validation errors, and device loss. It sends no results to a server. A browser error is not proof of native code execution.</p>
<h2>Environment</h2>
<pre id="result" translate="no">Checking…</pre>
<h2>Single-step cases</h2>
<button id="rgba-valid">1. RGBA 2×2 write + readback (valid control)</button>
<button id="rgba-short">2. RGBA 2×2 write with 15 of 16 bytes (expected reject)</button>
<button id="frame-valid">3. VideoFrame → GPU texture (valid control)</button>
<button id="frame-closed">4. Closed VideoFrame → GPU texture (expected reject)</button>
<button id="frame-crop">5. VideoFrame crop beyond source width (expected reject)</button>
<h2>Observed results</h2>
<pre id="probe-log" translate="no">No case run.</pre>
<script>
(async () => {
  const result = {
    userAgent: navigator.userAgent,
    secureContext: isSecureContext,
    webgpu: !!navigator.gpu,
    VideoFrame: typeof VideoFrame !== 'undefined',
    VideoDecoder: typeof VideoDecoder !== 'undefined',
    ImageDecoder: typeof ImageDecoder !== 'undefined'
  };
  if (navigator.gpu) {
    try {
      const adapter = await navigator.gpu.requestAdapter();
      result.webgpuAdapter = adapter ? 'available' : 'unavailable';
      if (adapter) result.webgpuFeatures = [...adapter.features].sort();
    } catch (error) { result.webgpuError = String(error); }
  }
  if (typeof VideoDecoder !== 'undefined') {
    result.videoCodecs = {};
    for (const codec of ['vp8', 'vp09.00.10.08', 'av01.0.04M.08']) {
      try {
        result.videoCodecs[codec] = (await VideoDecoder.isConfigSupported({
          codec, codedWidth: 64, codedHeight: 64
        })).supported;
      } catch (error) { result.videoCodecs[codec] = String(error); }
    }
  }
  document.getElementById('result').textContent = JSON.stringify(result, null, 2);
})().catch(error => document.getElementById('result').textContent = String(error));
</script>
<script src="probe.js"></script>
</html>
